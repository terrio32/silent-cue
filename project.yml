name: SilentCue
options:
  deploymentTarget:
    watchOS: 10.0

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # DEVELOPMENT_TEAM: YOUR_TEAM_ID

# signing:
#   automaticSigning:
#     teamID: YOUR_TEAM_ID

packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.19.0"
  Dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: "1.2.0"
  CasePaths:
    url: https://github.com/pointfreeco/swift-case-paths
    from: "1.1.0"
  SwiftNavigation:
    url: https://github.com/pointfreeco/swift-navigation
    from: "2.3.0"
  Clocks:
    url: https://github.com/pointfreeco/swift-clocks
    from: "1.0.0"

targets:
  SCCoordinator:
    type: framework
    platform: watchOS
    sources:
      - path: SCCoordinator
    dependencies:
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: Dependencies
        product: Dependencies
      - package: CasePaths
        product: CasePaths
      - package: SwiftNavigation
        product: SwiftNavigation
      - package: Clocks
        product: Clocks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akitorahayashi.SilentCue.Coordinator
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_BITCODE: NO
        SKIP_INSTALL: NO

  SilentCueStub:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akitorahayashi.SilentCue
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    sources: []

  "SilentCue Watch App":
    type: application
    platform: watchOS
    sources:
      - path: SilentCue Watch App
    dependencies:
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: Dependencies
        product: Dependencies
      - package: CasePaths
        product: CasePaths
      - package: SwiftNavigation
        product: SwiftNavigation
      - package: Clocks
        product: Clocks
    settings:
      base:
        DEVELOPMENT_LANGUAGE: en
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        SKIP_INSTALL: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.akitorahayashi.SilentCue.watchkitapp
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.akitorahayashi.SilentCue.watchkitapp
    info:
      path: SilentCue Watch App/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: SilentCue
        WKApplicationRefreshBackgroundTaskModes:
          - background-refresh-on-schedule
        WKBackgroundModes:
          - background-refresh-on-schedule
          - extended-runtime-session
        WKBackgroundTasks:
          - background-fetch
          - background-processing
        WKBackgroundRefresh: true
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true

  "SilentCue Watch AppTests":
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: SilentCue Watch AppTests
    dependencies:
      - target: "SilentCue Watch App"
      - target: SCCoordinator
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: Dependencies
        product: Dependencies
      - package: CasePaths
        product: CasePaths
      - package: SwiftNavigation
        product: SwiftNavigation
      - package: Clocks
        product: Clocks
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_BITCODE: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.akitorahayashi.SilentCue.watchkitapp.Tests
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.akitorahayashi.SilentCue.watchkitapp.Tests

schemes:
  "SilentCue Watch App":
    build:
      targets:
        "SilentCue Watch App": [running, testing, analyzing, archiving]
        SCCoordinator: [running, testing, analyzing, archiving]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - "SilentCue Watch AppTests"
    archive:
      buildConfiguration: Release

  "SilentCue Watch AppTests":
    build:
      targets:
        "SilentCue Watch AppTests": test
    test:
      config: Debug
      targets:
        - "SilentCue Watch AppTests"
